services:
  - type: web
    name: greenway-afs
    runtime: node
    plan: starter            # persistent disks require a paid plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # set in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: greenway-data
      mountPath: /var/data
      sizeGB: 5
