services:
  - type: web
    name: greenway-afs
    runtime: node
    plan: starter          # persistent disks need a paid plan
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: greenway-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SITE_URL
        value: https://www.greenwayafs.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
